[project]
name = "expense-rag"
version = "0.1.0"
description = "Mini RAG lab: grounded employee expense-policy assistant"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.0",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
expense-rag = "expense_rag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

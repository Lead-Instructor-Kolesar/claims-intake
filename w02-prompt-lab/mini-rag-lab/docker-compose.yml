services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: expense-policy-pg
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: expense_policy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d expense_policy"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  pgdata:

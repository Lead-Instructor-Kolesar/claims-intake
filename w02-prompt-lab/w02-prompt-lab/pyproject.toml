[project]
name = "w02-prompt-lab"
version = "0.1.0"
description = "Local two-model prompt evaluation harness for Ollama"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.11.7",
    "python-dotenv==1.1.1",
]

[project.scripts]
promptlab = "promptlab.run:main"

[dependency-groups]
dev = [
    "mypy==1.17.0",
    "pytest==8.4.1",
    "ruff==0.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promptlab"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]


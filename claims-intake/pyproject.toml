[project]
name = "claims-intake"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "pydantic", "uvicorn"]

[dependency-groups]
dev = ["pytest", "httpx", "mypy", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claims"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

name: checks

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: claims-intake

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest
